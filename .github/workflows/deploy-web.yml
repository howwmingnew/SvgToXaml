name: Deploy Web to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'svg-to-xaml-web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: svg-to-xaml-web/package-lock.json

      - name: Install dependencies
        working-directory: svg-to-xaml-web
        run: npm ci

      - name: Build
        working-directory: svg-to-xaml-web
        run: npx vite build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: svg-to-xaml-web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
